<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<body style="margin:0;padding:0;background:#f4f4f4;font-family:'Apple SD Gothic Neo',Arial,sans-serif;">
<table style="width:100%;background:#f4f4f4;padding:40px 0;border-collapse:collapse;border-spacing:0;">
    <tr>
        <td style="text-align:center;">
            <table style="width:480px;background:#ffffff;border-radius:12px;overflow:hidden;border-collapse:collapse;border-spacing:0;margin:0 auto;">
                <tr>
                    <td style="background:#1a1a2e;padding:28px 40px;">
                        <span style="color:#ffffff;font-size:22px;font-weight:700;letter-spacing:-0.5px;">ClimbStyle</span>
                    </td>
                </tr>
                <tr>
                    <td style="padding:40px 40px 8px;">
                        <p style="margin:0 0 6px;font-size:20px;font-weight:700;color:#1a1a2e;">이메일 인증번호 안내</p>
                        <p style="margin:0;font-size:14px;color:#555;line-height:1.8;">
                            안녕하세요! ClimbStyle을 이용해주셔서 진심으로 감사드립니다. 😊<br>
                            아래 인증번호를 입력창에 입력하시면 가입이 계속 진행됩니다.
                        </p>
                    </td>
                </tr>
                <tr>
                    <td style="padding:24px 40px 8px;">
                        <p style="margin:0;font-size:13px;font-weight:600;color:#888;">인증번호 (5분 이내 입력)</p>
                    </td>
                </tr>
                <tr>
                    <td style="padding:0 40px 28px;">
                        <div style="background:#f8f8fb;border-radius:8px;padding:24px;text-align:center;">
                            <span th:text="${code}" style="font-size:36px;font-weight:700;letter-spacing:8px;color:#1a1a2e;"></span>
                        </div>
                    </td>
                </tr>
                <tr>
                    <td style="padding:0 40px 40px;">
                        <p style="margin:0;font-size:13px;color:#555;line-height:1.8;">
                            ClimbStyle과 함께 즐거운 클라이밍 생활을 시작해보세요! 🧗<br>
                            언제든지 궁금한 점이 있으시면 고객센터를 통해 문의해 주세요.
                        </p>
                        <p style="margin:16px 0 0;font-size:12px;color:#aaa;line-height:1.7;">
                            본인이 요청하지 않으셨다면 이 메일을 무시하셔도 됩니다.<br>
                            인증번호는 발송 시점으로부터 5분간 유효합니다.
                        </p>
                    </td>
                </tr>
                <tr>
                    <td style="background:#f8f8fb;padding:16px 40px;text-align:center;">
                        <span style="font-size:12px;color:#bbb;">© 2026 ClimbStyle. All rights reserved.</span>
                    </td>
                </tr>
            </table>
        </td>
    </tr>
</table>
</body>
</html>
