<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="_csrf" th:content="${_csrf.token}" />
    <meta name="_csrf_header" th:content="${_csrf.headerName}" />
    <title>회원가입 | ClimbStyle</title>
    <link rel="stylesheet" th:href="@{/css/common/common.css}">
    <link rel="stylesheet" th:href="@{/css/auth/auth.css}">
</head>
<body>
<header>
    <div th:replace="~{fragments/common/header :: header}"></div>
</header>
<main class="auth-section">
    <div class="container auth-wrap">
        <section class="auth-card" aria-labelledby="register-title">
            <h1 id="register-title">회원가입</h1>
            <p class="auth-sub">클라이밍 패션을 발견하고 공유하는 커뮤니티, ClimbStyle을 시작해 보세요.</p>
            <form class="auth-form">
                <div class="field">
                    <label for="userId">아이디</label>
                    <div class="auth-row">
                        <input id="userId"
                               class="auth-input"
                               type="text"
                               placeholder="아이디를 입력하세요 (영문·숫자 5~20자)"
                               required
                               oninput="resetCheck('id')" />
                        <button class="btn btn-check" type="button" onclick="idCheck()">중복확인</button>
                    </div>
                </div>
                <div class="field">
                    <label for="userPassword">비밀번호</label>
                    <input id="userPassword"
                           type="password"
                           placeholder="비밀번호를 입력하세요"
                           required />
                </div>
                <div class="field">
                    <label for="passwordConfirm">비밀번호 확인</label>
                    <input id="passwordConfirm"
                           type="password"
                           placeholder="비밀번호를 다시 입력하세요"
                           required />
                </div>
                <div class="field">
                    <label for="userNm">이름</label>
                    <div class="auth-row">
                        <input id="userNm"
                               class="auth-input"
                               type="text"
                               placeholder="이름을 입력하세요"
                               required />
                    </div>
                </div>
                <div class="field">
                    <label for="userEmail">이메일</label>
                    <div class="auth-row">
                        <input id="userEmail"
                               class="auth-input"
                               type="email"
                               placeholder="이메일을 입력하세요"
                               required
                               oninput="resetEmailVerification()"/>
                        <button id="emailSendBtn" class="btn btn-check" type="button" onclick="sendVerificationCode()">인증번호 발송</button>
                    </div>
                    <div class="auth-row" id="emailVerifyRow" style="display:none; margin-top:8px;">
                        <label for="verificationCode">
                            <input id="verificationCode"
                                   class="auth-input"
                                   type="text"
                                   placeholder="인증번호 6자리 입력"
                                   maxlength="6" />
                        </label>
                        <button class="btn btn-check" type="button" onclick="verifyEmailCode()">인증 확인</button>
                    </div>
                    <div id="emailTimerWrap" style="display:none; margin-top:4px; font-size:12px; color:#888;">
                        남은 시간: <span id="emailTimer"></span>
                    </div>
                </div>
                <div class="field">
                    <label for="userNickname">닉네임</label>
                    <div class="auth-row">
                        <input id="userNickname"
                               class="auth-input"
                               type="text"
                               placeholder="닉네임을 입력하세요"
                               required
                               oninput="resetCheck('nickname')"/>
                        <button class="btn btn-check" type="button" onclick="nickNameCheck()">중복확인</button>
                    </div>
                </div>
                <div class="field field-row">
                    <label class="checkbox">
                        <input type="checkbox" required onchange="toggleTerms(this)" />
                        <span>이용약관 및 개인정보 처리방침에 동의합니다.</span>
                    </label>
                </div>
                <div class="field">
                    <button class="btn btn-primary auth-submit" type="button" onclick="register()"
                            disabled id="registerBtn">회원가입
                    </button>
                </div>
                <p class="auth-footer">이미 계정이 있나요?<a th:href="@{/auth/login}">로그인</a></p>
            </form>
        </section>
    </div>
</main>
<div th:replace="~{fragments/common/footer :: footer}"></div>
<script th:src="@{/js/common/api.js}"></script>
<script th:src="@{/js/common/validator.js}"></script>
<script>
    function idCheck() {
        if (!Validator.checkField("userId", "아이디")) {
            return;
        }

        if (!confirm("아이디 중복 여부를 확인하시겠습니까?")) {
            return;
        }

        API.callJson("/api/v1/users/id/availability", {
            method: "POST",
            body: JSON.stringify({
                userId: document.getElementById("userId").value.trim()
            })
        })
            .then(async response => {
                const body = await response.json();
                alert(body.message);
                if (response.ok) {
                    checkStatus.id = true;
                    updateRegisterBtn();
                }
            })
            .catch(() => {
                alert("일시적인 문제가 발생했습니다. 지속될 경우 관리자에게 문의하세요.");
            });
    }

    let emailTimerInterval = null;

    function sendVerificationCode() {
        if (!Validator.checkField("userEmail", "이메일")) {
            return;
        }

        const btn = document.getElementById("emailSendBtn");
        btn.disabled = true;
        btn.textContent = "발송 중...";

        API.callJson("/api/v1/users/email/verification-code", {
            method: "POST",
            body: JSON.stringify({
                userEmail: document.getElementById("userEmail").value.trim()
            })
        })
            .then(async response => {
                const body = await response.json();
                alert(body.message);
                if (response.ok) {
                    document.getElementById("emailVerifyRow").style.display = "flex";
                    document.getElementById("emailTimerWrap").style.display = "block";
                    btn.textContent = "재발송";
                    btn.disabled = false;
                    startEmailTimer(5 * 60);
                } else {
                    btn.textContent = "인증번호 발송";
                    btn.disabled = false;
                }
            })
            .catch(() => {
                alert("일시적인 문제가 발생했습니다. 지속될 경우 관리자에게 문의하세요.");
                btn.textContent = "인증번호 발송";
                btn.disabled = false;
            });
    }

    function verifyEmailCode() {
        const code = document.getElementById("verificationCode").value.trim();

        if (!code) {
            alert("인증번호를 입력해주세요.");
            return;
        }

        API.callJson("/api/v1/users/email/verification", {
            method: "POST",
            body: JSON.stringify({
                userEmail: document.getElementById("userEmail").value.trim(),
                verificationCode: code
            })
        })
            .then(async response => {
                const body = await response.json();
                alert(body.message);
                if (response.ok) {
                    clearInterval(emailTimerInterval);
                    document.getElementById("emailVerifyRow").style.display = "none";
                    document.getElementById("emailTimerWrap").style.display = "none";
                    document.getElementById("emailSendBtn").textContent = "인증 완료";
                    document.getElementById("emailSendBtn").disabled = true;
                    document.getElementById("userEmail").readOnly = true;
                    checkStatus.email = true;
                    updateRegisterBtn();
                }
            })
            .catch(() => {
                alert("일시적인 문제가 발생했습니다. 지속될 경우 관리자에게 문의하세요.");
            });
    }

    function startEmailTimer(seconds) {
        clearInterval(emailTimerInterval);
        let remaining = seconds;
        updateTimerDisplay(remaining);

        emailTimerInterval = setInterval(() => {
            remaining--;
            updateTimerDisplay(remaining);
            if (remaining <= 0) {
                clearInterval(emailTimerInterval);
                document.getElementById("emailTimer").textContent = "만료";
                document.getElementById("emailVerifyRow").style.display = "none";
                checkStatus.email = false;
                updateRegisterBtn();
            }
        }, 1000);
    }

    function updateTimerDisplay(seconds) {
        const m = String(Math.floor(seconds / 60)).padStart(2, "0");
        const s = String(seconds % 60).padStart(2, "0");
        document.getElementById("emailTimer").textContent = m + ":" + s;
    }

    function resetEmailVerification() {
        clearInterval(emailTimerInterval);
        checkStatus.email = false;
        document.getElementById("emailSendBtn").textContent = "인증번호 발송";
        document.getElementById("emailSendBtn").disabled = false;
        document.getElementById("userEmail").readOnly = false;
        document.getElementById("emailVerifyRow").style.display = "none";
        document.getElementById("emailTimerWrap").style.display = "none";
        if (document.getElementById("verificationCode")) {
            document.getElementById("verificationCode").value = "";
        }
        updateRegisterBtn();
    }

    function nickNameCheck() {
        if (!Validator.checkField("userNickname", "닉네임")) {
            return;
        }

        if (!Validator.rules.nickname(document.getElementById("userNickname").value.trim(), "닉네임")) {
            return;
        }

        if (!confirm("닉네임 중복 여부를 확인하시겠습니까?")) {
            return;
        }

        API.callJson("/api/v1/users/nickname/availability", {
            method: "POST",
            body: JSON.stringify({
                userNickname: document.getElementById("userNickname").value.trim()
            })
        })
            .then(async response => {
                const body = await response.json();
                alert(body.message);
                if (response.ok) {
                    checkStatus.nickname = true;
                    updateRegisterBtn();
                }
            })
            .catch(() => {
                alert("일시적인 문제가 발생했습니다. 지속될 경우 관리자에게 문의하세요.");
            });
    }

    function register() {
        if (!Validator.register()) {
            return;
        }

        if (!confirm("회원가입을 진행하시겠습니까?")) {
            return;
        }

        API.callJson("/api/v1/users", {
            method: "POST",
            body: JSON.stringify({
                userId: document.getElementById("userId").value.trim(),
                userPassword: document.getElementById("userPassword").value.trim(),
                userNm: document.getElementById("userNm").value.trim(),
                userEmail: document.getElementById("userEmail").value.trim(),
                userNickname: document.getElementById("userNickname").value.trim()
            })
        })
            .then(async response => {
                const body = await response.json();

                if (!response.ok) {
                    alert(body.message);
                    return;
                }

                alert(body.message);
                window.location.href = "/auth/login";
            })
            .catch(() => {
                alert("일시적인 문제가 발생했습니다. 지속될 경우 관리자에게 문의하세요.");
            });
    }

    const checkStatus = {
        id: false,
        email: false,
        nickname: false,
        terms: false
    };

    function updateRegisterBtn() {
        document.getElementById("registerBtn").disabled =
            !(checkStatus.id && checkStatus.email && checkStatus.nickname && checkStatus.terms);
    }

    function resetCheck(field) {
        checkStatus[field] = false;
        updateRegisterBtn();
    }


    function toggleTerms(checkbox) {
        checkStatus.terms = checkbox.checked;
        updateRegisterBtn();
    }
</script>
</body>
</html>
