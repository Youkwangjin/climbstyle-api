<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="_csrf" th:content="${_csrf.token}" />
    <meta name="_csrf_header" th:content="${_csrf.headerName}" />
    <title>계정 재활성화 | ClimbStyle</title>
    <link rel="stylesheet" th:href="@{/css/common/common.css}">
    <link rel="stylesheet" th:href="@{/css/auth/reactivate.css}">
</head>
<body>
<div class="reactivate-wrap">
    <div class="reactivate-card">
        <div class="reactivate-icon">
            <th:block th:replace="~{fragments/common/icons :: warning}" />
        </div>

        <div>
            <div class="reactivate-title">계정이 휴면 상태예요</div>
        </div>

        <p class="reactivate-desc">
            회원님의 계정은 현재 휴면 상태입니다.<br>
            계정을 재활성화하면 ClimbStyle의 모든 서비스를 다시 이용할 수 있어요.
        </p>

        <div class="reactivate-info">
            <ul>
                <li>재활성화 후 비공개 처리된 피드가 다시 공개됩니다.</li>
                <li>휴면 상태가 30일 이상 지속되면 계정이 자동으로 탈퇴 처리됩니다.</li>
            </ul>
        </div>

        <div class="reactivate-actions">
            <button type="button" class="btn btn-primary" onclick="reactivate()">계정 재활성화</button>
            <a href="javascript:void(0)" class="btn btn-outline" onclick="logout()">메인 패이지로 돌아가기</a>
        </div>
    </div>
</div>
<script th:src="@{/js/common/api.js}"></script>
<script th:src="@{/js/common/logout.js}"></script>
<script>
    function reactivate() {
        if (!confirm("계정을 재활성화 하시겠습니까?")) {
            return;
        }

        API.callJson("/api/v1/users/reactivate", {
            method: "PATCH"
        })
            .then(async response => {
                const body = await response.json();
                if (response.ok) {
                    alert(body.message);
                    location.href = "/my/profile";
                } else {
                    alert(body.message);
                }
            })
            .catch(() => {
                alert("일시적인 문제가 발생했습니다. 지속될 경우 관리자에게 문의하세요.");
            });
    }
</script>
</body>
</html>
