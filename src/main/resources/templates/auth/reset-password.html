<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <link rel="icon" th:href="@{/img/favicon.ico}" type="image/x-icon">
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="_csrf" th:content="${_csrf.token}" />
    <meta name="_csrf_header" th:content="${_csrf.headerName}" />
    <title>비밀번호 재설정 | ClimbStyle</title>
    <link rel="stylesheet" th:href="@{/css/common/common.css}">
    <link rel="stylesheet" th:href="@{/css/auth/auth.css}">
</head>
<body>
<header>
    <div th:replace="~{fragments/common/header :: header}"></div>
</header>
<main class="auth-section">
    <div class="container auth-wrap">
        <section class="auth-card auth-card--wide" aria-labelledby="reset-pw-title">
            <h1 id="reset-pw-title">비밀번호 재설정</h1>
            <p class="auth-sub">새로 사용할 비밀번호를 입력해 주세요.</p>

            <div id="stepReset">
                <div class="auth-form">
                    <input type="hidden" id="userEmail" th:value="${userEmail}" />
                    <div class="field">
                        <label for="userNewPassword">새 비밀번호</label>
                        <input id="userNewPassword" type="password" placeholder="영문·숫자·특수문자 포함 8~20자" />
                    </div>
                    <div class="field">
                        <label for="confirmPassword">새 비밀번호 확인</label>
                        <input id="confirmPassword" type="password" placeholder="새 비밀번호를 다시 입력하세요" />
                    </div>
                    <div class="field">
                        <button class="btn btn-primary auth-submit" type="button" onclick="resetPassword()">비밀번호 재설정</button>
                    </div>
                </div>
                <p class="auth-footer">
                    <a class="link-muted" th:href="@{/auth/login}">로그인으로 돌아가기</a>
                </p>
            </div>

            <div id="stepSuccess" style="display: none;">
                <div class="auth-form">
                    <div class="find-id-result">
                        <p class="find-id-label">비밀번호 재설정 완료</p>
                        <p class="find-id-value" style="font-size: 14px; font-weight: normal; color: var(--muted);">새 비밀번호로 로그인해 주세요.</p>
                    </div>
                    <div class="field">
                        <a class="btn btn-primary auth-submit" th:href="@{/auth/login}">로그인하기</a>
                    </div>
                </div>
            </div>
        </section>
    </div>
</main>
<div th:replace="~{fragments/common/footer :: footer}"></div>
<script th:src="@{/js/common/api.js}"></script>
<script th:src="@{/js/common/validator.js}"></script>
<script>
    (() => {
    function resetPassword() {
        const userEmail = document.getElementById("userEmail").value;
        const userNewPassword = document.getElementById("userNewPassword").value;
        const confirmPassword = document.getElementById("confirmPassword").value;

        if (!Validator.rules.required(userNewPassword, "새 비밀번호")) return;
        if (!Validator.rules.password(userNewPassword, "새 비밀번호")) return;
        if (!Validator.rules.match(userNewPassword, confirmPassword, "새 비밀번호")) return;

        API.callJson("/api/v1/users/password/recovery", {
            method: "POST",
            body: JSON.stringify({
                userEmail: userEmail,
                userNewPassword: userNewPassword
            })
        })
            .then(async response => {
                const body = await response.json();
                if (!response.ok) {
                    alert(body.message);
                    return;
                }
                document.getElementById("stepReset").style.display = "none";
                document.getElementById("stepSuccess").style.display = "block";
            })
            .catch(() => alert("일시적인 문제가 발생했습니다. 지속될 경우 관리자에게 문의하세요."));
    }

    window.resetPassword = resetPassword;
    })();
</script>
</body>
</html>
