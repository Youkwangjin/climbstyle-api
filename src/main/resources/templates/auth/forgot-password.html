<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <link rel="icon" th:href="@{/img/favicon.ico}" type="image/x-icon">
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="_csrf" th:content="${_csrf.token}" />
    <meta name="_csrf_header" th:content="${_csrf.headerName}" />
    <title>비밀번호 찾기 | ClimbStyle</title>
    <link rel="stylesheet" th:href="@{/css/common/common.css}">
    <link rel="stylesheet" th:href="@{/css/auth/auth.css}">
</head>
<body>
<header>
    <div th:replace="~{fragments/common/header :: header}"></div>
</header>
<main class="auth-section">
    <div class="container auth-wrap">
        <section class="auth-card" aria-labelledby="find-pw-title">
            <h1 id="find-pw-title">비밀번호 찾기</h1>
            <p class="auth-sub">가입 시 등록한 아이디와 이메일 주소를 입력해 주세요.</p>

            <div class="auth-form">
                <div class="field">
                    <label for="userId">아이디</label>
                    <input id="userId" type="text" placeholder="아이디를 입력하세요" />
                </div>
                <div class="field">
                    <label for="userEmail">이메일</label>
                    <div class="auth-row">
                        <input id="userEmail" type="email" class="auth-input" placeholder="이메일을 입력하세요" />
                        <button id="sendCodeBtn" class="btn btn-check" type="button" onclick="sendCode()">발송</button>
                    </div>
                </div>
                <div class="field" id="codeInputField" style="display: none;">
                    <label for="verificationCode">인증번호</label>
                    <div class="auth-row">
                        <input id="verificationCode" class="auth-input" type="text" placeholder="인증번호 6자리 입력" maxlength="6" />
                    </div>
                    <div id="codeTimerWrap" style="display: none; margin-top: 4px; font-size: 12px; color: #888;">
                        남은 시간: <span id="codeTimer"></span>
                    </div>
                </div>
                <div class="field" id="verifyBtnField" style="display: none;">
                    <button class="btn btn-primary auth-submit" type="button" onclick="verifyCode()">인증 확인</button>
                </div>
                <div id="initialSubmitField" class="field">
                    <button class="btn btn-primary auth-submit" type="button" onclick="sendCode()">인증번호 발송</button>
                </div>
            </div>
            <p class="auth-footer">
                <a class="link-muted" th:href="@{/auth/login}">로그인으로 돌아가기</a>
            </p>
        </section>
    </div>
</main>
<div th:replace="~{fragments/common/footer :: footer}"></div>
<script th:src="@{/js/common/api.js}"></script>
<script th:src="@{/js/common/validator.js}"></script>
<script>
    (() => {
    let codeTimerInterval = null;
    let codeSent = false;

    function sendCode() {
        const userId = document.getElementById("userId").value.trim();
        const userEmail = document.getElementById("userEmail").value.trim();

        if (!Validator.rules.required(userId, "아이디")) return;
        if (!Validator.rules.required(userEmail, "이메일")) return;

        const btn = document.getElementById("sendCodeBtn");
        btn.disabled = true;
        btn.textContent = "발송 중...";

        API.callJson("/api/v1/users/password/recovery/verification-code", {
            method: "POST",
            body: JSON.stringify({
                userId: userId,
                userEmail: userEmail
            })
        })
            .then(async response => {
                const body = await response.json();
                alert(body.message);
                if (response.ok) {
                    if (!codeSent) {
                        document.getElementById("codeInputField").style.display = "block";
                        document.getElementById("verifyBtnField").style.display = "block";
                        document.getElementById("initialSubmitField").style.display = "none";
                        document.getElementById("userId").readOnly = true;
                        document.getElementById("userEmail").readOnly = true;
                        codeSent = true;
                    }
                    document.getElementById("codeTimerWrap").style.display = "block";
                    btn.textContent = "재발송";
                    btn.disabled = false;
                    startTimer(5 * 60);
                } else {
                    btn.textContent = codeSent ? "재발송" : "발송";
                    btn.disabled = false;
                }
            })
            .catch(() => {
                alert("일시적인 문제가 발생했습니다. 지속될 경우 관리자에게 문의하세요.");
                btn.textContent = codeSent ? "재발송" : "발송";
                btn.disabled = false;
            });
    }

    function verifyCode() {
        const userEmail = document.getElementById("userEmail").value.trim();
        const verificationCode = document.getElementById("verificationCode").value.trim();

        if (!Validator.rules.required(verificationCode, "인증번호")) return;

        API.callJson("/api/v1/users/password/recovery/verification", {
            method: "POST",
            body: JSON.stringify({
                userEmail: userEmail,
                verificationCode: verificationCode
            })
        })
            .then(async response => {
                const body = await response.json();
                if (!response.ok) {
                    alert(body.message);
                    return;
                }
                clearInterval(codeTimerInterval);
                window.location.href = "/auth/forgot/password/reset";
            })
            .catch(() => alert("일시적인 문제가 발생했습니다. 지속될 경우 관리자에게 문의하세요."));
    }

    function startTimer(seconds) {
        clearInterval(codeTimerInterval);
        let remaining = seconds;
        updateTimerDisplay(remaining);

        codeTimerInterval = setInterval(() => {
            remaining--;
            updateTimerDisplay(remaining);
            if (remaining <= 0) {
                clearInterval(codeTimerInterval);
                document.getElementById("codeTimer").textContent = "만료";
                document.getElementById("codeInputField").style.display = "none";
                document.getElementById("verifyBtnField").style.display = "none";
            }
        }, 1000);
    }

    function updateTimerDisplay(seconds) {
        const m = String(Math.floor(seconds / 60)).padStart(2, "0");
        const s = String(seconds % 60).padStart(2, "0");
        document.getElementById("codeTimer").textContent = m + ":" + s;
    }

    window.sendCode = sendCode;
    window.verifyCode = verifyCode;
    })();
</script>
</body>
</html>
