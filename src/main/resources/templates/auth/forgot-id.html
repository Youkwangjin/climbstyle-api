<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <link rel="icon" th:href="@{/img/favicon.ico}" type="image/x-icon">
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="_csrf" th:content="${_csrf.token}" />
    <meta name="_csrf_header" th:content="${_csrf.headerName}" />
    <title>아이디 찾기 | ClimbStyle</title>
    <link rel="stylesheet" th:href="@{/css/common/common.css}">
    <link rel="stylesheet" th:href="@{/css/auth/auth.css}">
</head>
<body>
<header>
    <div th:replace="~{fragments/common/header :: header}"></div>
</header>
<main class="auth-section">
    <div class="container auth-wrap">
        <section class="auth-card" aria-labelledby="find-id-title">
            <h1 id="find-id-title">아이디 찾기</h1>
            <p class="auth-sub">가입 시 등록한 이름과 이메일 주소를 입력해 주세요.</p>
            <div id="stepFind">
                <div class="auth-form">
                    <div class="field">
                        <label for="userNm">이름</label>
                        <input id="userNm" type="text" placeholder="이름을 입력하세요" />
                    </div>
                    <div class="field">
                        <label for="userEmail">이메일</label>
                        <input id="userEmail" type="email" placeholder="이메일을 입력하세요" />
                    </div>
                    <div class="field">
                        <button class="btn btn-primary auth-submit" type="button" onclick="findId()">아이디 찾기</button>
                    </div>
                </div>
                <p class="auth-footer">
                    <a class="link-muted" th:href="@{/auth/login}">로그인으로 돌아가기</a>
                </p>
            </div>
            <div id="stepResult" style="display: none;">
                <div class="auth-form">
                    <div class="find-id-result">
                        <p class="find-id-label">회원님의 아이디</p>
                        <p class="find-id-value" id="maskedId"></p>
                    </div>
                    <div class="field">
                        <button class="btn btn-primary auth-submit" type="button" onclick="showVerifySection()">전체 아이디 보기</button>
                    </div>
                    <div id="verifySection" style="display: none;">
                        <div class="social-divider"><span>이메일 인증</span></div>
                        <div class="field">
                            <label>인증번호 발송</label>
                            <div class="auth-row">
                                <label for="verifyEmail">
                                    <input id="verifyEmail" type="email" class="auth-input" readonly />
                                </label>
                                <button id="sendCodeBtn" class="btn btn-check" type="button" onclick="sendCode()">발송</button>
                            </div>
                        </div>
                        <div class="field" id="codeInputField" style="display: none;">
                            <label for="verificationCode">인증번호</label>
                            <div class="auth-row">
                                <input id="verificationCode" class="auth-input" type="text" placeholder="인증번호 6자리 입력" maxlength="6" />
                                <button class="btn btn-check" type="button" onclick="revealId()">확인</button>
                            </div>
                            <div id="codeTimerWrap" style="display:none; margin-top:4px; font-size:12px; color:#888;">
                                남은 시간: <span id="codeTimer"></span>
                            </div>
                        </div>
                    </div>
                </div>
                <p class="auth-footer">
                    <a class="link-muted" th:href="@{/auth/login}">로그인으로 돌아가기</a>
                </p>
            </div>
            <div id="stepReveal" style="display: none;">
                <div class="auth-form">
                    <div class="find-id-result">
                        <p class="find-id-label">회원님의 아이디</p>
                        <p class="find-id-value" id="fullId"></p>
                    </div>
                    <div class="field">
                        <a class="btn btn-primary auth-submit" th:href="@{/auth/login}">로그인하기</a>
                    </div>
                </div>
            </div>
        </section>
    </div>
</main>
<div th:replace="~{fragments/common/footer :: footer}"></div>
<script th:src="@{/js/common/api.js}"></script>
<script>
    (() => {
    let foundEmail = "";
    let codeTimerInterval = null;
    function findId() {
        const userNm = document.getElementById("userNm").value.trim();
        const userEmail = document.getElementById("userEmail").value.trim();

        if (!userNm) {
            alert("이름을 입력해 주세요.");
            return;
        }

        if (!userEmail) {
            alert("이메일을 입력해 주세요.");
            return;
        }

        API.callJson("/api/v1/users/id/find", {
            method: "POST",
            body: JSON.stringify({
                userNm: userNm,
                userEmail: userEmail
            })
        })
            .then(async response => {
                const body = await response.json();
                if (!response.ok) {
                    alert(body.message);
                    return;
                }

                foundEmail = userEmail;
                document.getElementById("maskedId").textContent = body.data;
                document.getElementById("verifyEmail").value = userEmail;
                document.getElementById("stepFind").style.display = "none";
                document.getElementById("stepResult").style.display = "block";
            })
            .catch(() => alert("일시적인 문제가 발생했습니다. 지속될 경우 관리자에게 문의하세요."));
    }

    function showVerifySection() {
        document.getElementById("verifySection").style.display = "block";
    }

    function sendCode() {
        const btn = document.getElementById("sendCodeBtn");
        btn.disabled = true;
        btn.textContent = "발송 중...";

        API.callJson("/api/v1/users/id/find/verification-code", {
            method: "POST",
            body: JSON.stringify({
                userEmail: foundEmail
            })
        })
            .then(async response => {
                const body = await response.json();
                alert(body.message);
                if (response.ok) {
                    document.getElementById("codeInputField").style.display = "block";
                    document.getElementById("codeTimerWrap").style.display = "block";
                    btn.textContent = "재발송";
                    btn.disabled = false;
                    startTimer(5 * 60);
                } else {
                    btn.textContent = "발송";
                    btn.disabled = false;
                }
            })
            .catch(() => {
                alert("일시적인 문제가 발생했습니다. 지속될 경우 관리자에게 문의하세요.");
                btn.textContent = "발송";
                btn.disabled = false;
            });
    }

    function revealId() {
        const verificationCode = document.getElementById("verificationCode").value.trim();

        if (!verificationCode) {
            alert("인증번호를 입력해 주세요.");
            return;
        }

        API.callJson("/api/v1/users/id/reveal", {
            method: "POST",
            body: JSON.stringify({
                userEmail: foundEmail,
                verificationCode: verificationCode
            })
        })
            .then(async response => {
                const body = await response.json();
                if (!response.ok) {
                    alert(body.message);
                    return;
                }

                clearInterval(codeTimerInterval);
                document.getElementById("fullId").textContent = body.data;
                document.getElementById("stepResult").style.display = "none";
                document.getElementById("stepReveal").style.display = "block";
            })
            .catch(() => alert("일시적인 문제가 발생했습니다. 지속될 경우 관리자에게 문의하세요."));
    }

    function startTimer(seconds) {
        clearInterval(codeTimerInterval);
        let remaining = seconds;
        updateTimerDisplay(remaining);

        codeTimerInterval = setInterval(() => {
            remaining--;
            updateTimerDisplay(remaining);
            if (remaining <= 0) {
                clearInterval(codeTimerInterval);
                document.getElementById("codeTimer").textContent = "만료";
                document.getElementById("codeInputField").style.display = "none";
            }
        }, 1000);
    }

    function updateTimerDisplay(seconds) {
        const m = String(Math.floor(seconds / 60)).padStart(2, "0");
        const s = String(seconds % 60).padStart(2, "0");
        document.getElementById("codeTimer").textContent = m + ":" + s;
    }

    window.findId = findId;
    window.showVerifySection = showVerifySection;
    window.sendCode = sendCode;
    window.revealId = revealId;
    })();
</script>
</body>
</html>
