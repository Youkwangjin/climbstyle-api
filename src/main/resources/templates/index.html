<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ClimbStyle</title>
    <link rel="stylesheet" th:href="@{/css/common/common.css}">
    <link rel="stylesheet" th:href="@{/css/ranking/ranking.css}">
    <link rel="stylesheet" th:href="@{/css/index/main.css}">
</head>
<body>
<header>
    <div th:replace="~{fragments/common/header:: header}"></div>
</header>
<section class="hero section" id="hero">
    <div class="container hero-wrap">
        <div class="copy">
            <h1>클라이밍 패션 커뮤니티</h1>
            <p>스타일을 공유하고 랭킹으로 인정받는 공간. 좋아요로 나만의 무드를 기록해 보세요.</p>
            <div class="actions">
                <a class="btn btn-primary" th:href="@{/feed/new}">시작하기</a>
                <a class="btn" th:href="@{/feed}">둘러보기</a>
            </div>
        </div>
        <div class="hero-visual" role="img" aria-label="메인 비주얼 슬라이드">
            <div class="slides">
                <div class="slide is-active"
                     style="background-image: url(/img/main1.jpeg)"
                     aria-hidden="false"></div>
                <div class="slide"
                     style="background-image: url(/img/main2.jpeg)"
                     aria-hidden="true"></div>
                <div class="slide"
                     style="background-image: url(/img/main3.jpeg)"
                     aria-hidden="true"></div>
            </div>
        </div>
    </div>
</section>
<section class="section" id="ranking" aria-labelledby="rank-title">
    <div class="container">
        <div class="head">
            <div>
                <h2 id="rank-title">인기 클라이머 스타일</h2>
                <p class="sub">최고의 클라이밍 패션을 발견하세요</p>
            </div>
            <a class="btn" th:href="@{/rankings/realtime}">전체보기</a>
        </div>

        <p class="ranking-updated"
           th:if="${!#lists.isEmpty(realtimeTop3)}"
           th:text="${#temporals.format(realtimeTop3[0].rankingUpdated, 'M월 d일 HH:mm')} + ' 기준'">
        </p>

        <div th:if="${#lists.isEmpty(realtimeTop3)}" class="empty-state">
            <p>아직 랭킹 데이터가 없습니다.</p>
        </div>

        <div th:if="${!#lists.isEmpty(realtimeTop3)}">
            <th:block th:replace="~{fragments/ranking/index-podium :: indexPodium(${realtimeTop3})}"/>
        </div>
    </div>
</section>
<div th:replace="~{fragments/common/footer :: footer}"></div>
<script th:src="@{/js/common/logout.js}"></script>
<script>
    (function () {
        const slides = document.querySelectorAll(".hero-visual .slide");
        let current = 0;
        setInterval(function () {
            slides[current].classList.remove("is-active");
            slides[current].setAttribute("aria-hidden", "true");
            current = (current + 1) % slides.length;
            slides[current].classList.add("is-active");
            slides[current].setAttribute("aria-hidden", "false");
        }, 4000);
    })();
</script>
</body>
</html>
