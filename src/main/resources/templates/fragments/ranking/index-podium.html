<div th:fragment="indexPodium(rankingList)" class="podium"
     th:classappend="${rankingList.size() == 1 ? 'podium-single' :
                      (rankingList.size() == 2 ? 'podium-double' : '')}">

    <article class="podium-card podium-1" th:with="rank=${rankingList[0]}">
        <div class="podium-image">
            <img th:src="${rank.feedFilePath != null ? rank.feedFilePath : '/img/main1.png'}" alt="1등 피드" />
        </div>
        <div class="podium-info">
            <div class="podium-header">
                <div class="podium-rank" th:text="${rank.rankingOrder} + '등'">1등</div>
                <div class="rank-change rank-new"
                     th:if="${rank.rankingPreviousOrder == null}">NEW</div>
                <div class="rank-change rank-up"
                     th:if="${rank.rankingPreviousOrder != null && rank.rankingPreviousOrder > rank.rankingOrder}">
                    <span class="rank-arrow">↑</span>
                    <span class="rank-number" th:text="${rank.rankingPreviousOrder - rank.rankingOrder}">3</span>
                </div>
                <div class="rank-change rank-down"
                     th:if="${rank.rankingPreviousOrder != null && rank.rankingPreviousOrder < rank.rankingOrder}">
                    <span class="rank-arrow">↓</span>
                    <span class="rank-number" th:text="${rank.rankingOrder - rank.rankingPreviousOrder}">1</span>
                </div>
                <div class="rank-change rank-same"
                     th:if="${rank.rankingPreviousOrder != null && rank.rankingPreviousOrder == rank.rankingOrder}">—</div>
            </div>
            <h3 class="podium-title" th:text="${rank.feedTitle}">제목</h3>
            <div class="podium-user">
                <div class="podium-avatar">
                    <img th:if="${rank.userImageUrl != null}" th:src="${rank.userImageUrl}" alt="프로필" />
                </div>
                <span class="podium-username" th:text="${rank.userNickname}">사용자</span>
            </div>
            <div class="podium-likes">
                <th:block th:replace="~{fragments/common/icons :: heart}" />
                <span th:text="${#numbers.formatInteger(rank.rankingLikeCount, 0, 'COMMA')}">1,250</span>
            </div>
        </div>
    </article>

                </div>
                <div class="rank-change rank-down"

                    <span class="rank-arrow">↓</span>

                </div>
                <div class="rank-change rank-same"

    <article class="podium-card podium-3" th:if="${rankingList.size() >= 3}" th:with="rank=${rankingList[2]}">
