<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <link rel="icon" th:href="@{/img/favicon.ico}" type="image/x-icon">
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="_csrf" th:content="${_csrf.token}" />
    <meta name="_csrf_header" th:content="${_csrf.headerName}" />
    <title>관리자 로그인 | ClimbStyle</title>
    <link rel="stylesheet" th:href="@{/css/common/common.css}">
    <link rel="stylesheet" th:href="@{/css/admin/auth.css}">
</head>
<body class="admin-body">

<main class="admin-login-section">
    <div class="admin-login-wrap">
        <div class="admin-brand">
            <span class="admin-brand-logo">CS</span>
            <span class="admin-brand-name">ClimbStyle</span>
            <span class="admin-brand-badge">ADMIN</span>
        </div>
        <section class="admin-card" aria-labelledby="admin-login-title">
            <h1 id="admin-login-title">관리자 로그인</h1>
            <p class="admin-sub">관리자 계정으로 로그인하세요.</p>
            <form class="admin-form" onsubmit="adminLogin(); return false;">
                <div class="field">
                    <label for="adminId">아이디</label>
                    <input id="adminId"
                           type="text"
                           placeholder="관리자 아이디를 입력하세요"
                           required />
                </div>
                <div class="field">
                    <label for="adminPassword">비밀번호</label>
                    <input id="adminPassword"
                           type="password"
                           placeholder="비밀번호를 입력하세요"
                           required />
                </div>
                <div class="field">
                    <button class="btn-admin-submit" type="submit">로그인</button>
                </div>
            </form>
        </section>

        <p class="admin-login-footer">© 2026 ClimbStyle. All rights reserved.</p>
    </div>
</main>

<script th:src="@{/js/common/api.js}"></script>
<script>
    function adminLogin() {
        API.callJson("/api/v1/admin/login", {
            method: "POST",
            body: JSON.stringify({
                adminId: document.getElementById("adminId").value.trim(),
                adminPassword: document.getElementById("adminPassword").value.trim()
            })
        })
            .then(async response => {
                const body = await response.json();
                if (!response.ok) {
                    alert(body.message);
                    return;
                }
                window.location.href = body.data.redirectUrl;
            })
            .catch(() => {
                alert("일시적인 문제가 발생했습니다. 지속될 경우 관리자한테 문의하세요.")
            })
    }
</script>
</body>
</html>
