<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>관리자 메인 | ClimbStyle Admin</title>
    <link rel="stylesheet" th:href="@{/css/common/common.css}">
    <link rel="stylesheet" th:href="@{/css/admin/common.css}">
    <link rel="stylesheet" th:href="@{/css/admin/index/main.css}">
</head>
<body>
<header th:replace="~{fragments/admin/header :: header}"></header>
<div class="admin-wrap">
    <aside th:replace="~{fragments/admin/sidebar :: sidebar}"></aside>
    <main class="admin-main">
        <div class="page-header">
            <div>
                <div class="breadcrumb"><span>관리자 홈</span></div>
                <h1>대시보드</h1>
            </div>
        </div>
        <div class="dashboard-stat-grid">
            <div class="dashboard-stat-card">
                <div class="dashboard-stat-label">전체 회원</div>
                <div class="dashboard-stat-value color-blue" th:text="${stat.totalUserCount}"></div>
                <div class="dashboard-stat-sub">오늘 신규 <b class="color-blue" th:text="'+' + ${stat.todayUserCount}"></b></div>
            </div>
            <div class="dashboard-stat-card">
                <div class="dashboard-stat-label">전체 피드</div>
                <div class="dashboard-stat-value color-green" th:text="${stat.totalFeedCount}"></div>
                <div class="dashboard-stat-sub">오늘 작성 <b class="color-green" th:text="'+' + ${stat.todayFeedCount}"></b></div>
            </div>
            <div class="dashboard-stat-card">
                <div class="dashboard-stat-label">1:1 문의 대기</div>
                <div class="dashboard-stat-value color-orange" th:text="${stat.pendingInquiryCount}"></div>
                <div class="dashboard-stat-sub">처리 대기 중</div>
            </div>
            <div class="dashboard-stat-card">
                <div class="dashboard-stat-label">전체 공지사항</div>
                <div class="dashboard-stat-value color-dark" th:text="${stat.totalNoticeCount}"></div>
                <div class="dashboard-stat-sub">게시 중 <b th:text="${stat.visibleNoticeCount}"></b></div>
            </div>
        </div>
        <div class="dashboard-row3">
            <div class="dashboard-card">
                <div class="dashboard-card-title">최근 가입 회원</div>
                <div class="list-item" th:each="user : ${recentUsers}">
                    <div class="user-profile">
                        <img th:if="${!#strings.isEmpty(user.userImageUrl)}" th:src="${user.userImageUrl}" alt="프로필 이미지">
                    </div>
                    <div class="item-info">
                        <div class="item-name" th:text="${user.userNickname}"></div>
                        <div class="item-meta" th:text="${user.userEmail}"></div>
                    </div>
                    <div class="item-time" th:text="${#temporals.format(user.userCreated, 'yyyy-MM-dd HH:mm')}"></div>
                </div>
                <div class="empty-state" th:if="${#lists.isEmpty(recentUsers)}">
                    <p>최근 가입한 사용자가 없습니다.</p>
                </div>
            </div>
            <div class="dashboard-card">
                <div class="dashboard-card-title">미처리 1:1 문의</div>
                <div class="list-item" th:each="inquiry : ${inquiryList}">
                    <div class="item-info">
                        <div class="item-name" th:text="${inquiry.inquiryTitle}"></div>
                        <div class="item-meta" th:text="${inquiry.userNickname + ' · ' + inquiry.inquiryCreated}"></div>
                    </div>
                    <span class="badge-wait">대기</span>
                </div>
                <div class="empty-state" th:if="${#lists.isEmpty(inquiryList)}">
                    <p>미처리 문의가 없습니다.</p>
                </div>
            </div>
            <div class="dashboard-card">
                <div class="dashboard-card-title">최근 공지사항</div>
                <div class="list-item" th:each="notice : ${noticeList}">
                    <div class="item-info">
                        <div class="item-name" th:text="${notice.noticeTitle}"></div>
                        <div class="item-time" th:text="${#temporals.format(notice.noticeCreated, 'yyyy-MM-dd HH:mm')}"></div>
                    </div>
                    <span class="badge" th:classappend="${notice.noticePinYn == 'Y'} ? ' badge-pinned' : ' badge-notice'"
                          th:text="${notice.noticePinYn == 'Y'} ? '고정' : '공지'"></span>
                </div>
                <div class="empty-state" th:if="${#lists.isEmpty(noticeList)}">
                    <p>등록된 공지사항이 없습니다.</p>
                </div>
            </div>
        </div>
    </main>
</div>
<div th:replace="~{fragments/admin/footer :: footer}"></div>
</body>
</html>
