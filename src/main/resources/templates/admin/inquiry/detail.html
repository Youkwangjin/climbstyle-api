<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="_csrf" th:content="${_csrf.token}" />
    <meta name="_csrf_header" th:content="${_csrf.headerName}" />
    <title>1:1 문의 상세 | ClimbStyle Admin</title>
    <link rel="stylesheet" th:href="@{/css/common/common.css}">
    <link rel="stylesheet" th:href="@{/css/admin/common.css}">
    <link rel="stylesheet" th:href="@{/css/admin/inquiry/list.css}">
    <link rel="stylesheet" th:href="@{/css/admin/inquiry/detail.css}">
    <link href="https://cdn.quilljs.com/1.3.7/quill.snow.css" rel="stylesheet">
</head>
<body>
<header th:replace="~{fragments/admin/header :: header}"></header>
<div class="admin-wrap">
    <aside th:replace="~{fragments/admin/sidebar :: sidebar}"></aside>
    <main class="admin-main">
        <input type="hidden" id="inquiryNo" th:value="${inquiryDetail.inquiryNo}">
        <div class="page-header">
            <div>
                <div class="breadcrumb"><span>1:1 문의</span></div>
                <h1>1:1 문의 상세</h1>
            </div>
            <div style="display:flex; gap:8px;">
                <button type="button" class="btn btn-sm" onclick="inquiryList()">목록</button>
            </div>
        </div>
        <div class="inquiry-card">
            <div class="inquiry-card-header">
                <div class="inquiry-card-title-row">
                    <th:block th:switch="${inquiryDetail.inquiryStatus}">
                        <span th:case="'PENDING'"   class="badge badge-inquiry-pending">대기</span>
                        <span th:case="'PROGRESS'"  class="badge badge-inquiry-progress">처리중</span>
                        <span th:case="'COMPLETED'" class="badge badge-inquiry-completed">완료</span>
                        <span th:case="'CANCELLED'" class="badge badge-inquiry-cancelled">취소</span>
                    </th:block>
                    <h2 class="inquiry-title" th:text="${inquiryDetail.inquiryTitle}"></h2>
                </div>
                <div class="inquiry-meta">
                    <span class="meta-item">
                        <span class="meta-label">작성자</span>
                        <span class="meta-value" th:text="${inquiryDetail.userNickname}"></span>
                    </span>
                    <span class="meta-divider"></span>
                    <span class="meta-item">
                        <span class="meta-label">작성일</span>
                        <span class="meta-value"
                              th:text="${#temporals.format(inquiryDetail.inquiryCreated, 'yyyy.MM.dd HH:mm')}"></span>
                    </span>
                </div>
            </div>
            <div class="inquiry-content">
                <p th:text="${inquiryDetail.inquiryContent}"></p>
            </div>
            <div class="inquiry-attachments"
                 th:if="${inquiryDetail.inquiryFiles != null and !#lists.isEmpty(inquiryDetail.inquiryFiles)}">
                <div class="attachments-label">첨부파일</div>
                <ul class="attachment-list">
                    <li class="attachment-item" th:each="file : ${inquiryDetail.inquiryFiles}">
                        <span class="attachment-icon">
                            <th:block th:replace="~{fragments/common/icons :: file}" />
                        </span>
                        <span class="attachment-name" th:text="${file.inquiryFileOriginalName}"></span>
                        <span class="attachment-size" th:text="${file.inquiryFileSize}"></span>
                        <a th:href="${file.inquiryFilePath}" class="attachment-down" download>
                            <th:block th:replace="~{fragments/common/icons :: download}" />
                        </a>
                    </li>
                </ul>
            </div>
        </div>
        <div class="answer-card">
            <div class="answer-card-header">
                <h3 class="answer-card-title">관리자 답변</h3>
                <span th:if="${inquiryDetail.inquiryDeleteYn == 'Y'}" class="deleted-notice">
                    사용자가 삭제한 문의입니다
                </span>
            </div>
            <div class="status-bar" th:if="${inquiryDetail.inquiryDeleteYn == 'N'}">
                <span class="status-label">처리 상태</span>
                <label>
                    <select class="filter-select" id="inquiryStatus">
                        <option value="PENDING"   th:selected="${inquiryDetail.inquiryStatus == 'PENDING'}">대기</option>
                        <option value="PROGRESS"  th:selected="${inquiryDetail.inquiryStatus == 'PROGRESS'}">처리중</option>
                        <option value="COMPLETED" th:selected="${inquiryDetail.inquiryStatus == 'COMPLETED'}">완료</option>
                        <option value="CANCELLED" th:selected="${inquiryDetail.inquiryStatus == 'CANCELLED'}">취소</option>
                    </select>
                </label>
                <button type="button" class="btn btn-sm" onclick="changeStatus()">상태 변경</button>
            </div>
            <div id="quill-editor"
                 th:classappend="${inquiryDetail.inquiryDeleteYn == 'Y'} ? 'is-disabled'"></div>
            <input type="hidden" id="answerContent">
            <input type="hidden" id="existingAnswerContent" th:value="${inquiryDetail.inquiryAnswerContent}">
            <div class="answer-footer"
                 th:if="${inquiryDetail.inquiryDeleteYn == 'N' and (inquiryDetail.inquiryAnswerContent == null or inquiryDetail.inquiryAnswerContent == '')}">
                <button type="button" class="btn btn-primary" onclick="saveAnswer()">답변 저장</button>
            </div>
        </div>
    </main>
</div>
<div th:replace="~{fragments/admin/footer :: footer}"></div>
<script src="https://cdn.quilljs.com/1.3.7/quill.min.js"></script>
<script th:src="@{/js/common/icons.js}"></script>
<script th:src="@{/js/common/quillEditor.js}"></script>
<script th:src="@{/js/common/validator.js}"></script>
<script th:src="@{/js/common/api.js}"></script>
<script>
    (function () {
        const existingAnswer = document.getElementById("existingAnswerContent").value;
        if (existingAnswer) {
            quill.root.innerHTML = existingAnswer;
            quill.disable();
        }
    })();

    function inquiryList() {
        const params = new URLSearchParams({
            pageNo: "[[${request.pageNo}]]",
            inquiryStatus: "[[${request.inquiryStatus}]]",
            searchType: "[[${request.searchType}]]",
            searchName: "[[${request.searchName}]]"
        });
        location.href = "/admin/inquiries?" + params.toString();
    }

    function changeStatus() {
        if (!confirm("처리 상태를 변경하시겠습니까?")) return;

        API.callJson(`/api/v1/admin/inquiries/${document.getElementById("inquiryNo").value}/status`, {
            method: "PATCH",
            body: JSON.stringify({
                inquiryStatus: document.getElementById("inquiryStatus").value.trim()
            })
        })
            .then(async response => {
                const body = await response.json();
                if (!response.ok) {
                    alert(body.message);
                    return;
                }
                alert(body.message);
                location.reload();
            })
            .catch(() => {
                alert("일시적인 문제가 발생했습니다. 지속될 경우 관리자에게 문의하세요.");
            });
    }

    function saveAnswer() {
        if (!Validator.inquiryAnswer()) return;
        if (!confirm("답변을 저장하시겠습니까?")) return;

        API.callJson(`/api/v1/admin/inquiries/${document.getElementById("inquiryNo").value}/answer`, {
            method: "PATCH",
            body: JSON.stringify({
                inquiryAnswerContent: quill.root.innerHTML
            })
        })
            .then(async response => {
                const body = await response.json();
                if (!response.ok) {
                    alert(body.message);
                    return;
                }
                alert(body.message);
                location.reload();
            })
            .catch(() => {
                alert("일시적인 문제가 발생했습니다. 지속될 경우 관리자에게 문의하세요.");
            });
    }
</script>
</body>
</html>
