<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="_csrf" th:content="${_csrf.token}" />
    <meta name="_csrf_header" th:content="${_csrf.headerName}" />
    <title>공지사항 상세 | ClimbStyle Admin</title>
    <link rel="stylesheet" th:href="@{/css/common/common.css}">
    <link rel="stylesheet" th:href="@{/css/admin/common.css}">
    <link rel="stylesheet" th:href="@{/css/notice/detail.css}">
    <link rel="stylesheet" th:href="@{/css/admin/notice/detail.css}">
</head>
<body>
<header th:replace="~{fragments/admin/header :: header}"></header>
<div class="admin-wrap">
    <aside th:replace="~{fragments/admin/sidebar :: sidebar}"></aside>
    <main class="admin-main">
        <div class="page-header">
            <div>
                <h1>공지사항 상세</h1>
            </div>
            <div style="display:flex; gap:8px;">
                <button type="button" class="btn btn-sm" onclick="noticeList()">목록</button>
                <button type="button" class="btn btn-sm btn-danger" onclick="deleteNotice()">삭제</button>
                <a th:href="@{/admin/notices/{noticeNo}/edit(noticeNo=${noticeDetail.noticeNo})}" class="btn btn-sm btn-primary">수정</a>
            </div>
        </div>
        <div class="detail-wrap">
            <label for="noticeNo">
                <input type="hidden" id="noticeNo" th:value="${noticeDetail.noticeNo}">
            </label>
            <div class="detail-header">
                <div class="detail-header-top">
                    <div class="detail-category">
                        <th:block th:switch="${noticeDetail.noticeCategory}">
                            <span th:case="'0'" class="badge badge-notice">공지</span>
                            <span th:case="'1'" class="badge badge-update">업데이트</span>
                            <span th:case="'2'" class="badge badge-event">이벤트</span>
                        </th:block>
                        <span th:if="${noticeDetail.noticePinYn == 'Y'}" class="badge badge-pinned">고정</span>
                        <span th:if="${noticeDetail.noticeVisibleYn == 'N'}" class="badge badge-hidden">숨김</span>
                    </div>
                </div>
                <h1 class="detail-title" th:text="${noticeDetail.noticeTitle}"></h1>
                <div class="detail-meta">
                    <span class="meta-item">
                        <span class="meta-label">작성일</span>
                        <span class="meta-value" th:text="${#temporals.format(noticeDetail.noticeCreated, 'yyyy.MM.dd')}"></span>
                    </span>
                    <span class="meta-divider"></span>
                    <span class="meta-item">
                        <span class="meta-label">조회수</span>
                        <span class="meta-value" th:text="${#numbers.formatInteger(noticeDetail.noticeHit, 0, 'COMMA')}"></span>
                    </span>
                </div>
            </div>
            <div class="detail-body">
                <div class="detail-content ql-editor" th:utext="${noticeDetail.noticeContent}"></div>
            </div>
            <div class="detail-attachments" th:if="${!#lists.isEmpty(noticeDetail.noticeFiles)}">
                <div class="attachments-label">첨부파일</div>
                <ul class="attachment-list">
                    <li class="attachment-item" th:each="file : ${noticeDetail.noticeFiles}">
                        <span class="attachment-icon">
                            <th:block th:replace="~{fragments/common/icons :: file}" />
                        </span>
                        <span class="attachment-name" th:text="${file.noticeFileOriginalName}"></span>
                        <span class="attachment-size" th:text="${file.noticeFileSize}"></span>
                        <a th:href="${file.noticeFilePath}" class="attachment-down" download>
                            <th:block th:replace="~{fragments/common/icons :: download}" />
                        </a>
                    </li>
                </ul>
            </div>
            <div class="detail-nav">
                <a th:if="${noticeDetail.prevNotice != null}"
                   th:href="@{/admin/notices/{noticeNo}(noticeNo=${noticeDetail.prevNotice.noticeNo})}"
                   class="nav-item">
                    <span class="nav-direction">
                        <th:block th:replace="~{fragments/common/icons :: chevron-left}" />
                        이전글
                    </span>
                    <span class="nav-title" th:text="${noticeDetail.prevNotice.noticeTitle}"></span>
                    <span class="nav-date" th:text="${#temporals.format(noticeDetail.prevNotice.noticeCreated, 'yyyy.MM.dd')}"></span>
                </a>
                <a th:if="${noticeDetail.nextNotice != null}"
                   th:href="@{/admin/notices/{noticeNo}(noticeNo=${noticeDetail.nextNotice.noticeNo})}"
                   class="nav-item">
                    <span class="nav-direction">
                        <th:block th:replace="~{fragments/common/icons :: chevron-right}" />
                        다음글
                    </span>
                    <span class="nav-title" th:text="${noticeDetail.nextNotice.noticeTitle}"></span>
                    <span class="nav-date" th:text="${#temporals.format(noticeDetail.nextNotice.noticeCreated, 'yyyy.MM.dd')}"></span>
                </a>
            </div>
        </div>
    </main>
</div>
<div th:replace="~{fragments/admin/footer :: footer}"></div>
<script th:src="@{/js/common/api.js}"></script>
<script>
    function noticeList() {
        const params = new URLSearchParams({
            pageNo: "[[${request.pageNo}]]",
            noticeCategory: "[[${request.noticeCategory}]]",
            searchType: "[[${request.searchType}]]",
            searchName: "[[${request.searchName}]]"
        });

        location.href = "/admin/notices?" + params.toString();
    }

    function deleteNotice() {
        if (!confirm("공지사항을 삭제하시겠습니까?")) return;

        API.callFormData(`/api/v1/notices/${document.getElementById("noticeNo").value}`, {
            method: "DELETE"
        })
            .then(async response => {
                const body = await response.json();

                if (!response.ok) {
                    alert(body.message);
                    return;
                }

                alert(body.message);
                location.href = "/admin/notices";
            })
            .catch(() => {
                alert("일시적인 문제가 발생했습니다. 지속될 경우 관리자에게 문의하세요.");
            });
    }
</script>
</body>
</html>
