<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>회원 관리 | ClimbStyle Admin</title>
    <link rel="stylesheet" th:href="@{/css/common/common.css}">
    <link rel="stylesheet" th:href="@{/css/admin/common.css}">
    <link rel="stylesheet" th:href="@{/css/admin/user/list.css}">
</head>
<body>
<header th:replace="~{fragments/admin/header :: header}"></header>
<div class="admin-wrap">
    <aside th:replace="~{fragments/admin/sidebar :: sidebar}"></aside>
    <main class="admin-main">
        <div class="page-header">
            <div>
                <div class="breadcrumb"><span>회원</span></div>
                <h1>회원 관리</h1>
            </div>
        </div>
        <div class="stats-row">
            <div class="stat-chip">
                <span class="num blue" th:text="${#numbers.formatInteger(request.totalCount, 0, 'COMMA')}">0</span>
                <span class="stat-label">전체 회원</span>
            </div>
        </div>
        <div class="toolbar">
            <div class="toolbar-left">
                <div class="search-wrap">
                    <span class="search-icon">
                        <th:block th:replace="~{fragments/common/icons :: search}" />
                    </span>
                    <label>
                        <input class="search-input" type="text" id="searchName"
                               th:value="${request.searchName}"
                               placeholder="검색어를 입력하세요"
                               onkeydown="if(event.key === 'Enter') searchUser()"/>
                    </label>
                </div>
                <label>
                    <select class="filter-select" id="userStatus" onchange="searchUser()">
                        <option value="" th:selected="${request.userStatus == null or request.userStatus == ''}">전체 상태</option>
                        <option value="ACTIVE" th:selected="${request.userStatus == 'ACTIVE'}">활성</option>
                        <option value="DORMANT" th:selected="${request.userStatus == 'DORMANT'}">휴면</option>
                        <option value="SUSPENDED" th:selected="${request.userStatus == 'SUSPENDED'}">정지</option>
                        <option value="WITHDRAWN" th:selected="${request.userStatus == 'WITHDRAWN'}">탈퇴</option>
                    </select>
                </label>
                <label>
                    <select class="filter-select" id="searchType">
                        <option value="userId" th:selected="${request.searchType == 'userId'}">아이디</option>
                        <option value="userNm" th:selected="${request.searchType == 'userNm'}">이름</option>
                        <option value="userEmail" th:selected="${request.searchType == 'userEmail'}">이메일</option>
                        <option value="userNickname" th:selected="${request.searchType == 'userNickname'}">닉네임</option>
                    </select>
                </label>
            </div>
            <div class="toolbar-right">
                <button class="btn btn-sm" type="button" onclick="resetSearch()">초기화</button>
                <button class="btn btn-sm btn-primary" type="button" onclick="searchUser()">검색</button>
            </div>
        </div>
        <div class="table-wrap">
            <table>
                <thead>
                <tr>
                    <th class="th-num">번호</th>
                    <th>아이디</th>
                    <th>닉네임</th>
                    <th>이름</th>
                    <th>이메일</th>
                    <th class="th-status">상태</th>
                    <th class="th-date">가입일</th>
                </tr>
                </thead>
                <tbody>
                <tr th:if="${#lists.isEmpty(userList)}">
                    <td colspan="8" style="text-align:center; padding:40px; color:var(--admin-muted);">
                        등록된 회원이 없습니다.
                    </td>
                </tr>
                <tr th:each="user, iterStat : ${userList}"
                    th:onclick="|userDetail(${user.userNo})|" style="cursor:pointer;">
                    <td class="td-num"
                        th:text="${request.totalCount - request.startRowNum - iterStat.index}"></td>
                    <td th:text="${user.userId}"></td>
                    <td th:text="${user.userNickname}"></td>
                    <td th:text="${user.userNm}"></td>
                    <td th:text="${user.userEmail}"></td>
                    <td class="td-status">
                        <th:block th:switch="${user.userStatus}">
                            <span th:case="'ACTIVE'"    class="badge badge-user-active">활성</span>
                            <span th:case="'DORMANT'"   class="badge badge-user-dormant">휴면</span>
                            <span th:case="'SUSPENDED'" class="badge badge-user-suspended">정지</span>
                            <span th:case="'WITHDRAWN'" class="badge badge-user-withdrawn">탈퇴</span>
                        </th:block>
                    </td>
                    <td class="td-date" th:text="${#temporals.format(user.userCreated, 'yyyy.MM.dd')}"></td>
                </tr>
                </tbody>
            </table>
        </div>
        <th:block th:replace="~{fragments/admin/user/pagination :: pagination(
            ${request},
            ${userList},
            ${currentUrl}
        )}"/>
    </main>
</div>
<div th:replace="~{fragments/admin/footer :: footer}"></div>
<script>
    function searchUser() {
        const params = new URLSearchParams({
            pageNo: String(1),
            userStatus: document.getElementById("userStatus").value,
            searchType: document.getElementById("searchType").value,
            searchName: document.getElementById("searchName").value.trim()
        });
        location.href = "/admin/users?" + params.toString();
    }

    function userDetail(userNo) {
        const params = new URLSearchParams({
            pageNo: "[[${request.pageNo}]]",
            userStatus: "[[${request.userStatus}]]",
            searchType: "[[${request.searchType}]]",
            searchName: "[[${request.searchName}]]"
        });
        location.href = "/admin/users/" + userNo + "?" + params.toString();
    }

    function resetSearch() {
        location.href = "/admin/users";
    }
</script>
</body>
</html>
