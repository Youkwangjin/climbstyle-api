<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title th:text="'ClimbStyle | ' + ${pageTitle}">ClimbStyle | 랭킹</title>
    <link rel="stylesheet" th:href="@{/css/common/common.css}">
    <link rel="stylesheet" th:href="@{/css/ranking/ranking.css}">
</head>
<body>
<header>
    <div th:replace="~{fragments/common/header :: header}"></div>
</header>

<section class="section" id="ranking">
    <div class="container">
        <div class="head">
            <div>
                <h2 th:text="'🏆 피드 ' + ${pageTitle}">🏆 피드 랭킹</h2>
                <p class="sub">최고의 클라이밍 패션을 발견하세요</p>
            </div>
        </div>

        <div class="ranking-tabs">
            <a th:each="type : ${allRankingTypes}" th:href="${type.url}" class="tab-btn" th:classappend="${currentUrl == type.url ? 'is-active' : ''}" th:text="${type.shortDescription}">탭</a>
        </div>

        <p class="ranking-updated"
           th:if="${!#lists.isEmpty(rankingList)}"
           th:text="${#temporals.format(rankingList[0].rankingUpdated, 'M월 d일 HH:mm')} + ' 기준'">
        </p>

        <div th:if="${#lists.isEmpty(rankingList)}" class="empty-state">
            <p>아직 랭킹 데이터가 없습니다.</p>
        </div>

        <div th:if="${request.pageNoAsInt == 1 && !#lists.isEmpty(rankingList)}">
            <th:block th:replace="~{fragments/ranking/ranking-podium :: podium(${rankingList})}"/>
            <th:block th:if="${rankingList.size() >= 6}"
                      th:replace="~{fragments/ranking/ranking-grid-3 :: grid3(${rankingList})}"/>
            <th:block th:if="${rankingList.size() >= 10}"
                      th:replace="~{fragments/ranking/ranking-grid-4 :: grid4(${rankingList})}"/>
        </div>

        <div th:if="${request.pageNoAsInt > 1}">
            <th:block th:replace="~{fragments/ranking/ranking-grid-5 :: grid5(${rankingList})}"/>
        </div>

        <th:block th:replace="~{fragments/ranking/pagination :: pagination(
            ${request},
            ${rankingList},
            ${currentUrl}
        )}"/>
    </div>
</section>
<div th:replace="~{fragments/common/footer :: footer}"></div>
<script th:src="@{/js/common/icons.js}"></script>
</body>
</html>
