<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <link rel="icon" th:href="@{/img/favicon.ico}" type="image/x-icon">
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>공지사항 | ClimbStyle</title>
    <link rel="stylesheet" th:href="@{/css/common/common.css}">
    <link rel="stylesheet" th:href="@{/css/notice/list.css}">
</head>
<body>
<header>
    <div th:replace="~{fragments/common/header :: header}"></div>
</header>
<section class="section">
    <div class="container">
        <div class="page-title-wrap">
            <h1>공지사항</h1>
            <p>ClimbStyle의 새로운 소식과 업데이트를 확인하세요.</p>
        </div>
        <div class="filter-tabs">
            <a th:href="@{/notices(pageNo=1, searchType=${request.searchType}, searchName=${request.searchName})}"
               th:classappend="${request.noticeCategory == null or request.noticeCategory == ''}? 'is-active'"
               class="tab">전체</a>
            <a th:href="@{/notices(pageNo=1, noticeCategory='0', searchType=${request.searchType}, searchName=${request.searchName})}"
               th:classappend="${request.noticeCategory == '0'} ? 'is-active'"
               class="tab">공지</a>
            <a th:href="@{/notices(pageNo=1, noticeCategory='1', searchType=${request.searchType}, searchName=${request.searchName})}"
               th:classappend="${request.noticeCategory == '1'} ? 'is-active'"
               class="tab">업데이트</a>
            <a th:href="@{/notices(pageNo=1, noticeCategory='2', searchType=${request.searchType}, searchName=${request.searchName})}"
               th:classappend="${request.noticeCategory == '2'} ? 'is-active'"
               class="tab">이벤트</a>
        </div>
        <div class="list-toolbar">
            <p class="total-count">총 <strong th:text="${#numbers.formatInteger(request.totalCount, 0, 'COMMA')}">0</strong>개의 공지</p>
            <div class="search-form">
                <label>
                    <select class="search-select" id="searchType">
                        <option value="noticeTitle" th:selected="${request.searchType == null or request.searchType == 'noticeTitle'}">제목</option>
                        <option value="noticeContentText" th:selected="${request.searchType == 'noticeContentText'}">내용</option>
                        <option value="noticeTitleContent" th:selected="${request.searchType == 'noticeTitleContent'}">제목+내용</option>
                    </select>
                </label>
                <div class="search-wrap">
                    <span class="search-icon">
                        <th:block th:replace="~{fragments/common/icons :: search}" />
                    </span>
                    <label>
                        <input class="search-input" type="text" id="searchName" th:value="${request.searchName}"
                               placeholder="검색어를 입력하세요"
                               onkeydown="if(event.key === 'Enter') searchNotice()"/>
                    </label>
                </div>
                <button class="search-btn" type="button" onclick="searchNotice()">검색</button>
                <button class="reset-btn" type="button" onclick="resetSearch()">초기화</button>
            </div>
        </div>
        <div class="notice-table-wrap">
            <table class="notice-table">
                <thead>
                <tr>
                    <th>번호</th>
                    <th class="th-pin">고정</th>
                    <th class="th-category">구분</th>
                    <th class="th-title">제목</th>
                    <th class="th-right">날짜</th>
                    <th class="th-right">조회</th>
                    <th class="th-file">첨부</th>
                </tr>
                </thead>
                <tbody>
                <tr th:if="${#lists.isEmpty(noticeList)}">
                    <td colspan="7" class="td-empty">등록된 공지사항이 없습니다.</td>
                </tr>
                <tr th:each="notice, iterStat : ${noticeList}"
                    th:classappend="${notice.noticePinYn == 'Y'} ? 'row-pinned'"
                    th:onclick="|noticeDetail(${notice.noticeNo})|">

                <td class="td-num" th:text="${request.totalCount - request.startRowNum - iterStat.index}"></td>
                    <td class="td-pin">
                        <span th:if="${notice.noticePinYn == 'Y'}" class="badge badge-pin">고정</span>
                    </td>
                    <td class="td-category">
                        <th:block th:switch="${notice.noticeCategory}">
                            <span th:case="'0'" class="badge badge-notice">공지</span>
                            <span th:case="'1'" class="badge badge-update">업데이트</span>
                            <span th:case="'2'" class="badge badge-event">이벤트</span>
                        </th:block>
                    </td>
                    <td class="td-title">
                        <span th:if="${notice.noticeNew}" class="badge badge-new">NEW</span>
                        <span class="title-text" th:text="${notice.noticeTitle}"></span>
                    </td>
                    <td class="td-date" th:text="${#temporals.format(notice.noticeCreated, 'yyyy.MM.dd')}"></td>
                    <td class="td-views" th:text="${#numbers.formatInteger(notice.noticeHit, 0, 'COMMA')}"></td>
                    <td class="td-file">
                        <span th:if="${notice.hasFile}" th:insert="~{fragments/common/icons :: file}"></span>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
        <th:block th:replace="~{fragments/notice/pagination :: pagination(
            ${request},
            ${noticeList},
            ${currentUrl}
        )}"/>
    </div>
</section>
<div th:replace="~{fragments/common/footer :: footer}"></div>
<script th:src="@{/js/common/logout.js}"></script>
<script>
    function searchNotice(pageNo) {
        const params = new URLSearchParams({
            pageNo: pageNo ?? 1,
            noticeCategory: "[[${request.noticeCategory}]]",
            searchType: document.getElementById("searchType").value,
            searchName: document.getElementById("searchName").value.trim()
        });

        location.href = "/notices?" + params.toString();
    }

    function resetSearch() {
        document.getElementById("searchType").value = "noticeTitle";
        document.getElementById("searchName").value = "";
        searchNotice();
    }

    function noticeDetail(noticeNo) {
        const params = new URLSearchParams({
            pageNo: "[[${request.pageNo}]]",
            noticeCategory: "[[${request.noticeCategory}]]",
            searchType: "[[${request.searchType}]]",
            searchName: "[[${request.searchName}]]"
        });

        location.href = "/notices/" + noticeNo + "?" + params.toString();
    }
</script>
</body>
</html>
